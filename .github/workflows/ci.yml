name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  frontend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./CI-frontend/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build


  backend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./CI-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build backend
        run: mvn clean package -DskipTests


  docker:
  runs-on: ubuntu-latest
  needs: [frontend-ci, backend-ci]

  steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set frontend image
      run: echo "FRONTEND=docker.io/${{ secrets.DOCKER_USERNAME }}/frontend:latest" >> $GITHUB_ENV

    - name: Build frontend
      run: docker build -t $FRONTEND ./CI-frontend/frontend

    - name: Push frontend
      run: docker push $FRONTEND

    - name: Set backend image
      run: echo "BACKEND=docker.io/${{ secrets.DOCKER_USERNAME }}/backend:latest" >> $GITHUB_ENV

    - name: Build backend
      run: docker build -t $BACKEND ./CI-backend

    - name: Push backend
      run: docker push $BACKEND